<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc">
<title id="title">Flying Computer II rover and ground stack</title>
<desc id="desc">Rover camera, video, radio, control and clock synchronization connect wirelessly to the ground radio and video receiver, which fans out to Android and a Linux display host.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#53657a"/></marker>
  <marker id="both" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#53657a"/></marker>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b4d}
    .panel{fill:#f5f8fc;stroke:#cad5e2;stroke-width:2}.title{font-size:23px;font-weight:700;letter-spacing:1px;fill:#38516d}
    .node{fill:#fff;stroke:#52708f;stroke-width:2;rx:15}.core{fill:#e9f3ff;stroke:#2780c3}.wire{fill:#fff6d9;stroke:#cf9b1a}
    .label{font-size:17px;font-weight:600;text-anchor:middle}.small{font-size:14px;font-weight:500;text-anchor:middle;fill:#52657a}
    .edge{fill:none;stroke:#53657a;stroke-width:2.5;marker-end:url(#arrow)}.bi{fill:none;stroke:#53657a;stroke-width:2.5;marker-start:url(#both);marker-end:url(#both)}
    .air{fill:none;stroke:#cf9b1a;stroke-width:3;stroke-dasharray:10 8;marker-start:url(#both);marker-end:url(#both)}
  </style>
</defs>
<rect x="12" y="12" width="1416" height="586" rx="26" fill="#fff"/>
<rect class="panel" x="28" y="54" width="610" height="510" rx="24"/>
<rect class="panel" x="802" y="54" width="610" height="510" rx="24"/>
<text class="title" x="56" y="94">ROVER</text><text class="title" x="830" y="94">GROUND STATION</text>
<!-- rover flow -->
<rect class="node" x="65" y="142" width="190" height="74"/><text class="label" x="160" y="173">OV5647 camera</text><text class="small" x="160" y="197">video capture</text>
<rect class="node core" x="325" y="128" width="252" height="100"/><text class="label" x="451" y="166">ESP32-P4</text><text class="small" x="451" y="193">H.264 + RTP / FEC</text>
<path class="edge" d="M255 179H317"/>
<rect class="node" x="325" y="294" width="252" height="76"/><text class="label" x="451" y="326">winject-l3</text><text class="small" x="451" y="350">radio manager</text>
<path class="edge" d="M451 228V286"/>
<rect class="node core" x="350" y="433" width="202" height="74"/><text class="label" x="451" y="464">ESP32-C6 radio</text><text class="small" x="451" y="488">SDIO interface</text>
<path class="edge" d="M451 370V425"/>
<rect class="node wire" x="68" y="304" width="190" height="72"/><text class="label" x="163" y="334">RC + telemetry</text><text class="small" x="163" y="357">separate upstream</text>
<path class="bi" d="M258 340H317"/>
<rect class="node wire" x="68" y="432" width="190" height="72"/><text class="label" x="163" y="462">krono client</text><text class="small" x="163" y="485">clock synchronization</text>
<path class="bi" d="M258 468H302V358H317"/>
<!-- wireless link -->
<path class="air" d="M570 470C650 420 730 420 800 470"/><rect x="618" y="406" width="135" height="34" rx="17" fill="#fff6d9"/><text class="small" x="685" y="429">wireless link</text>
<!-- ground flow -->
<rect class="node core" x="866" y="433" width="202" height="74"/><text class="label" x="967" y="464">ESP32-C6 radio</text><text class="small" x="967" y="488">SDIO interface</text>
<rect class="node" x="886" y="294" width="252" height="76"/><text class="label" x="1012" y="326">winject-l3</text><text class="small" x="1012" y="350">radio manager</text>
<path class="edge" d="M967 425V378"/>
<rect class="node core" x="886" y="142" width="252" height="92"/><text class="label" x="1012" y="178">ESP32-P4</text><text class="small" x="1012" y="204">video receiver</text>
<path class="edge" d="M1012 294V242"/>
<rect class="node" x="1210" y="128" width="164" height="72"/><text class="label" x="1292" y="158">USB</text><text class="small" x="1292" y="181">video + channels</text>
<rect class="node" x="1210" y="232" width="164" height="74"/><text class="label" x="1292" y="262">Android app</text><text class="small" x="1292" y="285">ground view + control</text>
<path class="edge" d="M1138 177H1202"/><path class="edge" d="M1292 200V224"/>
<rect class="node" x="1210" y="358" width="164" height="76"/><text class="label" x="1292" y="388">RTP multicast</text><text class="small" x="1292" y="412">Ethernet</text>
<rect class="node" x="1210" y="462" width="164" height="76"/><text class="label" x="1292" y="492">GS Linux host</text><text class="small" x="1292" y="516">decode + display</text>
<path class="edge" d="M1138 199H1170V396H1202"/><path class="edge" d="M1292 434V454"/>
<rect class="node wire" x="886" y="514" width="252" height="38"/><text class="small" x="1012" y="539">krono reference clock</text><path class="bi" d="M1012 514V378"/>
</svg>
